name: CI

on:
  pull_request:
  push:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck · lint · test (Nx, affected on PRs)
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            npx nx affected -t typecheck lint test --base=origin/${{ github.base_ref }} --head=HEAD
          else
            npx nx run-many -t typecheck lint test
          fi
      - name: Build (Next.js + OpenNext worker, API dry-run deploy)
        run: |
          npx nx run-many -t build
          npx nx run @outfit/web:build:cf
          cd apps/api && npx wrangler deploy --dry-run --outdir /tmp/api-dist
